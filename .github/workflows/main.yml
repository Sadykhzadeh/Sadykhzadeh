name: Update WakaTime & Telegram Info News

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  push:
    branches: "master"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

# Two overlapping runs would race on pushing the README
concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Start from the branch tip, not the commit that triggered the run: an earlier run in the
      # queue may already have pushed a README commit on top of it
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Generate README.md
        run: bun run src/index.ts

      - name: Push new README.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Update README posts and timestamp"
          # The mirror from got.az or another run can land between checkout and push;
          # replay this commit on top and keep our freshly generated README
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin master && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Update WakaTime stats
        uses: athul/waka-readme@v0.3.1
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKA }}
